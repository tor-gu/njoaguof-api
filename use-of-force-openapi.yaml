openapi: '3.0.2'
info:
  version: '1.0.0'
  title: 'njoaguof-api'
  description: >
    # NJ OAG Use of Force data, from 2020-10-01 to 2026-09-30

    A cleaned and normalized version of the NJ Attorney General's Use of Force
    database (https://www.njoag.gov/force/), as published in the
    [njoaguof data package for R](https://github.com/tor-gu/njoaguof).
    Field names and values are the same as in the R package.


    ## Conventions

    * Every reply has the form `{"data": [...], "links": {...}, "meta": {...}}`.
    `data` is always a list of flat records.

    * Collections are paginated with `page_number` (default 1) and `page_size`
    (default 100). Follow `links.next` until it is absent to retrieve every page.
    `links` carries the filters of the request.

    * A request that matches nothing, or a `page_number` past the last page,
    returns `404`. An unknown query parameter or an invalid value returns `400`.

    * Incident filters (`year`, `start_date`, `end_date`, `agency`,
    `agency_county`, `incident_municipality`, `incident_municipality_county`,
    `officer_name_id`) are combined with AND. On subject, attribute and count
    endpoints they select the incidents, and the rows linked to those incidents
    (by `form_id`) are returned.

    * Missing values are `null`. Dates are `YYYY-MM-DD`. Filters match values
    exactly, so they can not select `null`.


    ## Attributes

    Multi-value fields of the source data are served as *attribute* tables, one
    row per value. There are two shapes:

    * `incident`: values that apply to the whole incident. Rows are
    `{form_id, <value>}`.

    * `incident_subject`: values that apply to individual subjects, but can not
    reliably be assigned to one. Rows are `{form_id, index, <value>}`, where
    `index` is the position of the value in the source list. **`index` is not a
    subject index**: do not join these rows to `/subjects` on `index`.

    `GET /nj/use_of_force/attributes` lists the attributes, their shapes and
    value columns.


    ## Caveats

    * `agency_county` is the county of the *agency*, not of the incident. The
    incident location is `incident_municipality` /
    `incident_municipality_county`.

    * `other_officer_involved` is only populated for 2020 and 2021, so it is
    not available as a count dimension. `subject_injured_count` is not one
    either, because `/counts/subjects?by=injured` already covers it.

    * One `officer_name_id` can appear with several spellings of the officer
    name. `officer_name` is the most common one; the others are listed at
    `/officers/{officer_name_id}/name_variants`.

servers:
  - url: "{protocol}://{server}"
    variables:
      protocol:
        default: https
        enum:
          - https
          - http
      server:
        default: api.tor-gu.com
tags:
- name: incidents
  description: Use of force incidents and their subjects
- name: attributes
  description: Multi-value incident and incident-subject fields
- name: agencies
  description: Reporting agencies
- name: officers
  description: Officers
- name: counts
  description: Aggregate counts
paths:
  /nj/use_of_force/incidents:
    summary: Get use of force incidents
    parameters:
    - $ref: '#/components/parameters/year'
    - $ref: '#/components/parameters/startDate'
    - $ref: '#/components/parameters/endDate'
    - $ref: '#/components/parameters/agency'
    - $ref: '#/components/parameters/agencyCounty'
    - $ref: '#/components/parameters/incidentMunicipality'
    - $ref: '#/components/parameters/incidentMunicipalityCounty'
    - $ref: '#/components/parameters/officerNameIdQuery'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        All incidents matching the filters, ordered by `form_id`.
      responses:
        '200':
          description: Incidents matching the filters
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"form_id": 15937, "report_number": "UOF20-10-5", "incident_case_number": "20-41343", "incident_date_1": "2020-10-01", "agency_county": "Passaic County", "agency_name": "Clifton PD", "incident_municipality": "Clifton city", "incident_municipality_county": "Passaic County", "officer_name_id": 27195, "officer_name": "Fabricio Martinez", "officer_age": 29, "officer_race": null, "officer_rank": "Not Provided", "officer_gender": "Other", "officer_injured": false, "video_footage": "Yes", "indoors": false, "outdoors": true, "subject_count": 1, "subject_injured_count": 0, "other_officer_involved": true, "officer_in_uniform": true}
                - {"form_id": 15951, "report_number": "UOF20-10-7", "incident_case_number": "M20-20063", "incident_date_1": "2020-10-01", "agency_county": "Ocean County", "agency_name": "Manchester Twp PD", "incident_municipality": "Manchester township", "incident_municipality_county": "Ocean County", "officer_name_id": 11732, "officer_name": "Theodore Cooke", "officer_age": 44, "officer_race": null, "officer_rank": "Not Provided", "officer_gender": "Other", "officer_injured": false, "video_footage": "Yes", "indoors": true, "outdoors": false, "subject_count": 1, "subject_injured_count": 0, "other_officer_involved": true, "officer_in_uniform": true}
                links:
                  self: https://api.tor-gu.com/nj/use_of_force/incidents?year=2020&page_number=1&page_size=2
                  next: https://api.tor-gu.com/nj/use_of_force/incidents?year=2020&page_number=2&page_size=2
                meta:
                  record_count: 3879
                  page_count: 1940
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - incidents
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IncidentsFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/incidents/{form_id}:
    summary: Get a use of force incident by form_id
    parameters:
    - $ref: '#/components/parameters/formId'
    get:
      responses:
        '200':
          description: The incident with the provided `form_id`
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"form_id": 16301, "report_number": "UOF20-10-5", "incident_case_number": "21 - 4948", "incident_date_1": "2021-04-08", "agency_county": "Gloucester County", "agency_name": "Clayton PD", "incident_municipality": "Clayton borough", "incident_municipality_county": "Gloucester County", "officer_name_id": 5516, "officer_name": "Stanley Williams", "officer_age": 63, "officer_race": null, "officer_rank": "Not Provided", "officer_gender": "Other", "officer_injured": false, "video_footage": "Yes", "indoors": false, "outdoors": true, "subject_count": 2, "subject_injured_count": 1, "other_officer_involved": true, "officer_in_uniform": true}
                links: {"self": "https://api.tor-gu.com/nj/use_of_force/incidents/16301"}
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - incidents
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IncidentsFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/incidents/{form_id}/subjects:
    summary: Get the subjects of a use of force incident
    parameters:
    - $ref: '#/components/parameters/formId'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      responses:
        '200':
          description: The subjects of the incident with the provided `form_id`, ordered by `index`
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"form_id": 16301, "index": 1, "arrested": false, "type": "Person", "age": 23, "juvenile": false, "race": "Black", "gender": "Female", "injured": false, "injured_prior": false}
                - {"form_id": 16301, "index": 2, "arrested": null, "type": null, "age": 26, "juvenile": false, "race": null, "gender": null, "injured": true, "injured_prior": false}
                links: {"self": "https://api.tor-gu.com/nj/use_of_force/incidents/16301/subjects?page_number=1&page_size=100"}
                meta:
                  record_count: 2
                  page_count: 1
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - incidents
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IncidentsFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/incidents/{form_id}/attributes/{attribute}:
    summary: Get the values of one attribute for a use of force incident
    parameters:
    - $ref: '#/components/parameters/formId'
    - $ref: '#/components/parameters/attribute'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The rows of one attribute table for the incident. For `incident_subject`
        attributes, rows are ordered by `index`, the position in the source list
        (not a subject index).
      responses:
        '200':
          description: The attribute rows for the incident with the provided `form_id`
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              examples:
                incident:
                  summary: An `incident` attribute (/incidents/16301/attributes/type)
                  value:
                    data:
                    - {"form_id": 16301, "type": "Potential Mental Health Incident"}
                    - {"form_id": 16301, "type": "Suspicious person"}
                    - {"form_id": 16301, "type": "Disturbance (drinking, fighting, disorderly)"}
                    links: {"self": "https://api.tor-gu.com/nj/use_of_force/incidents/16301/attributes/type?page_number=1&page_size=100"}
                    meta:
                      record_count: 3
                      page_count: 1
                incident_subject:
                  summary: An `incident_subject` attribute (/incidents/19542/attributes/subject_resistance)
                  value:
                    data:
                    - {"form_id": 19542, "index": 1, "subject_resistance": "Verbal"}
                    - {"form_id": 19542, "index": 2, "subject_resistance": "Verbal"}
                    - {"form_id": 19542, "index": 3, "subject_resistance": "Aggressive resistance (attempt to attack or harm)"}
                    links: {"self": "https://api.tor-gu.com/nj/use_of_force/incidents/19542/attributes/subject_resistance?page_number=1&page_size=100"}
                    meta:
                      record_count: 3
                      page_count: 1
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - incidents
      - attributes
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AttributesFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/subjects:
    summary: Get the subjects of use of force incidents
    parameters:
    - $ref: '#/components/parameters/year'
    - $ref: '#/components/parameters/startDate'
    - $ref: '#/components/parameters/endDate'
    - $ref: '#/components/parameters/agency'
    - $ref: '#/components/parameters/agencyCounty'
    - $ref: '#/components/parameters/incidentMunicipality'
    - $ref: '#/components/parameters/incidentMunicipalityCounty'
    - $ref: '#/components/parameters/officerNameIdQuery'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The subjects of all incidents matching the filters, ordered by
        `form_id` and `index`.
      responses:
        '200':
          description: Subjects of the incidents matching the filters
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"form_id": 15937, "index": 1, "arrested": true, "type": "Person", "age": 27, "juvenile": false, "race": "Black", "gender": "Male", "injured": false, "injured_prior": false}
                - {"form_id": 15951, "index": 1, "arrested": true, "type": "Person", "age": 23, "juvenile": false, "race": "Black", "gender": "Female", "injured": false, "injured_prior": true}
                links:
                  self: https://api.tor-gu.com/nj/use_of_force/subjects?page_number=1&page_size=2
                  next: https://api.tor-gu.com/nj/use_of_force/subjects?page_number=2&page_size=2
                meta:
                  record_count: 112149
                  page_count: 56075
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - incidents
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IncidentsFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/attributes:
    summary: Get the list of attributes
    get:
      description: >
        The codebook: every attribute, the R table it comes from, its shape
        (`incident` or `incident_subject`) and the name of its value column.
      responses:
        '200':
          description: All attributes
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"attribute": "contact_origin", "table": "incident_contact_origin", "shape": "incident", "value_column": "contact_origin"}
                - {"attribute": "lighting", "table": "incident_lighting", "shape": "incident", "value_column": "lighting"}
                - {"attribute": "location_type", "table": "incident_location_type", "shape": "incident", "value_column": "location_type"}
                - {"attribute": "officer_injury_type", "table": "incident_officer_injury_type", "shape": "incident", "value_column": "officer_injury_type"}
                - {"attribute": "officer_medical_treatment", "table": "incident_officer_medical_treatment", "shape": "incident", "value_column": "officer_medical_treatment"}
                - {"attribute": "planned_contact", "table": "incident_planned_contact", "shape": "incident", "value_column": "planned_contact"}
                - {"attribute": "subject_action", "table": "incident_subject_action", "shape": "incident_subject", "value_column": "subject_action"}
                - {"attribute": "subject_force_type", "table": "incident_subject_force_type", "shape": "incident_subject", "value_column": "force_type"}
                - {"attribute": "subject_injury", "table": "incident_subject_injury", "shape": "incident_subject", "value_column": "subject_injury"}
                - {"attribute": "subject_medical_treatment", "table": "incident_subject_medical_treatment", "shape": "incident_subject", "value_column": "subject_medical_treatment"}
                - {"attribute": "subject_perceived_condition", "table": "incident_subject_perceived_condition", "shape": "incident_subject", "value_column": "perceived_condition"}
                - {"attribute": "subject_reason_not_arrested", "table": "incident_subject_reason_not_arrested", "shape": "incident_subject", "value_column": "reason_not_arrested"}
                - {"attribute": "subject_resistance", "table": "incident_subject_resistance", "shape": "incident_subject", "value_column": "subject_resistance"}
                - {"attribute": "type", "table": "incident_type", "shape": "incident", "value_column": "type"}
                - {"attribute": "video_type", "table": "incident_video_type", "shape": "incident", "value_column": "video_type"}
                - {"attribute": "weather", "table": "incident_weather", "shape": "incident", "value_column": "weather"}
                links: {"self": "https://api.tor-gu.com/nj/use_of_force/attributes"}
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - attributes
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AttributesFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/attributes/{attribute}:
    summary: Get all rows of an attribute table
    parameters:
    - $ref: '#/components/parameters/attribute'
    - $ref: '#/components/parameters/year'
    - $ref: '#/components/parameters/startDate'
    - $ref: '#/components/parameters/endDate'
    - $ref: '#/components/parameters/agency'
    - $ref: '#/components/parameters/agencyCounty'
    - $ref: '#/components/parameters/incidentMunicipality'
    - $ref: '#/components/parameters/incidentMunicipalityCounty'
    - $ref: '#/components/parameters/officerNameIdQuery'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The rows of one attribute table for all incidents matching the
        filters, ordered by `form_id` (and `index`, for `incident_subject`
        attributes).
      responses:
        '200':
          description: Attribute rows for the incidents matching the filters
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"form_id": 15937, "type": "Disturbance (drinking, fighting, disorderly)"}
                - {"form_id": 15951, "type": "MV/Traffic Stop"}
                - {"form_id": 15952, "type": "Eluding"}
                links:
                  self: https://api.tor-gu.com/nj/use_of_force/attributes/type?page_number=1&page_size=3
                  next: https://api.tor-gu.com/nj/use_of_force/attributes/type?page_number=2&page_size=3
                meta:
                  record_count: 150415
                  page_count: 50139
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - attributes
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AttributesFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/attributes/{attribute}/levels:
    summary: Get the allowed values of an attribute
    parameters:
    - $ref: '#/components/parameters/attribute'
    get:
      description: >
        The declared values of the attribute, in their declared order. A
        declared value is not necessarily present in the data.
      responses:
        '200':
          description: Levels of the attribute
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"attribute": "weather", "position": 1, "level": "Clear"}
                - {"attribute": "weather", "position": 2, "level": "Cloudy"}
                - {"attribute": "weather", "position": 3, "level": "Fog"}
                - {"attribute": "weather", "position": 4, "level": "Rain"}
                - {"attribute": "weather", "position": 5, "level": "Snow/Sleet/Ice"}
                links: {"self": "https://api.tor-gu.com/nj/use_of_force/attributes/weather/levels"}
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - attributes
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AttributesFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/agencies:
    summary: Get all reporting agencies
    parameters:
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        Every (`agency_name`, `agency_county`) pair in the data, with its
        number of incidents, ordered by `agency_name` and `agency_county`.
        Some agency names (e.g. "Washington Twp PD") are shared by agencies in
        different counties, so a name can appear more than once. Some incidents
        have no `agency_county`, so it can be `null`. To get the incidents of
        an agency, use `/nj/use_of_force/incidents?agency=...`, adding
        `agency_county` where the name is ambiguous.
      responses:
        '200':
          description: All agencies
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"agency_name": "Aberdeen Twp PD", "agency_county": "Monmouth County", "incident_count": 157}
                - {"agency_name": "Absecon City PD", "agency_county": "Atlantic County", "incident_count": 144}
                - {"agency_name": "Allendale PD", "agency_county": "Bergen County", "incident_count": 20}
                links:

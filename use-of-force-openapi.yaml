        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/counts/incidents:
    summary: Count incidents, grouped by up to three dimensions
    parameters:
    - $ref: '#/components/parameters/byIncidents'
    - $ref: '#/components/parameters/year'
    - $ref: '#/components/parameters/startDate'
    - $ref: '#/components/parameters/endDate'
    - $ref: '#/components/parameters/agency'
    - $ref: '#/components/parameters/agencyCounty'
    - $ref: '#/components/parameters/incidentMunicipality'
    - $ref: '#/components/parameters/incidentMunicipalityCounty'
    - $ref: '#/components/parameters/officerNameIdQuery'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The number of distinct incidents matching the filters, for each
        combination of the `by` dimensions, ordered by the `by` columns. Only
        combinations with a non-zero count are returned, and `null` is its own
        group. Values with declared levels are ordered as their levels (see
        `/attributes/{attribute}/levels`), with `null` last.


        When `by` includes an attribute, an incident with several values of
        that attribute is counted once under each value, so the counts can add
        up to more than the number of incidents.
      responses:
        '200':
          description: Incident counts
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              examples:
                byYear:
                  summary: by=year
                  value:
                    data:
                    - {"year": 2020, "count": 3879}
                    - {"year": 2021, "count": 16105}
                    - {"year": 2022, "count": 17499}
                    - {"year": 2023, "count": 19105}
                    - {"year": 2024, "count": 19768}
                    - {"year": 2025, "count": 19135}
                    - {"year": 2026, "count": 14517}
                    links: {"self": "https://api.tor-gu.com/nj/use_of_force/counts/incidents?by=year&page_number=1&page_size=100"}
                    meta:
                      record_count: 7
                      page_count: 1
                byYearAndAttribute:
                  summary: by=year,video_type&year=2023
                  value:
                    data:
                    - {"year": 2023, "video_type": "Body Worn", "count": 18259}
                    - {"year": 2023, "video_type": "CED Camera", "count": 95}
                    - {"year": 2023, "video_type": "Cell Phone", "count": 114}
                    links:
                      self: https://api.tor-gu.com/nj/use_of_force/counts/incidents?by=year%2Cvideo_type&year=2023&page_number=1&page_size=3
                      next: https://api.tor-gu.com/nj/use_of_force/counts/incidents?by=year%2Cvideo_type&year=2023&page_number=2&page_size=3
                    meta:
                      record_count: 8
                      page_count: 3
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - counts
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CountsFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /nj/use_of_force/counts/subjects:
    summary: Count subjects, grouped by up to three dimensions
    parameters:
    - $ref: '#/components/parameters/bySubjects'
    - $ref: '#/components/parameters/year'
    - $ref: '#/components/parameters/startDate'
    - $ref: '#/components/parameters/endDate'
    - $ref: '#/components/parameters/agency'
    - $ref: '#/components/parameters/agencyCounty'
    - $ref: '#/components/parameters/incidentMunicipality'
    - $ref: '#/components/parameters/incidentMunicipalityCounty'
    - $ref: '#/components/parameters/officerNameIdQuery'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/pageSize'
    get:
      description: >
        The number of subjects of the incidents matching the filters, for each
        combination of the `by` dimensions, ordered by the `by` columns. Only
        combinations with a non-zero count are returned, and `null` is its own
        group. Values with declared levels are ordered as their levels (see
        `/attributes/{attribute}/levels`), with `null` last.
      responses:
        '200':
          description: Subject counts
          content:
            'application/vnd.api+json':
              schema:
                $ref: '#/components/schemas/success'
              example:
                data:
                - {"agency_county": "Essex County", "race": "American Indian", "count": 11}
                - {"agency_county": "Essex County", "race": "Asian", "count": 58}
                - {"agency_county": "Essex County", "race": "Black", "count": 8294}
                links:
                  self: https://api.tor-gu.com/nj/use_of_force/counts/subjects?agency_county=Essex%20County&by=agency_county%2Crace&page_number=1&page_size=3
                  next: https://api.tor-gu.com/nj/use_of_force/counts/subjects?agency_county=Essex%20County&by=agency_county%2Crace&page_number=2&page_size=3
                meta:
                  record_count: 8
                  page_count: 3
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - counts
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CountsFunction.Arn}/invocations"
        responses:
          default:
            statusCode: "201"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
components:
  schemas:
    success:
      type: object
      required:
        - data
        - links
      properties:
        data:
          $ref: "#/components/schemas/data"
        links:
          $ref: "#/components/schemas/links"
        meta:
          $ref: "#/components/schemas/meta"
    data:
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/incident'
        - type: array
          items:
            $ref: '#/components/schemas/subject'
        - type: array
          items:
            $ref: '#/components/schemas/incidentAttributeRow'
        - type: array
          items:
            $ref: '#/components/schemas/incidentSubjectAttributeRow'
        - type: array
          items:
            $ref: '#/components/schemas/codebookRow'
        - type: array
          items:
            $ref: '#/components/schemas/levelRow'
        - type: array
          items:
            $ref: '#/components/schemas/agency'
        - type: array
          items:
            $ref: '#/components/schemas/officer'
        - type: array
          items:
            $ref: '#/components/schemas/nameVariant'
        - type: array
          items:
            $ref: '#/components/schemas/countRow'
    links:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/link"
    link:
      type: string
      format: uri-reference
    meta:
      type: object
      properties:
        record_count:
          type: integer
        page_count:
          type: integer
    formId:
      description: Unique identifier of an incident, present in the source data
      type: integer
      example: 16301
    officerNameId:
      description: >
        Officer identifier. In the source data, this is column `UserID`.
      type: integer
      example: 17048
    county:
      type: string
      enum: ["Atlantic County", "Bergen County", "Burlington County", "Camden County", "Cape May County", "Cumberland County", "Essex County", "Gloucester County", "Hudson County", "Hunterdon County", "Mercer County", "Middlesex County", "Monmouth County", "Morris County", "Ocean County", "Passaic County", "Salem County", "Somerset County", "Sussex County", "Union County", "Warren County"]
      example: Essex County
    race:
      type: string
      enum: ["American Indian", "Asian", "Asian/Pacific Islander", "Black", "Hispanic", "Native Hawaiian or other Pacific Islander", "Pacific Islander", "Two or more races", "White", "Other"]
    gender:
      type: string
      enum: ["Male", "Female", "Non-Binary/X", "Other"]
    incident:
      type: object
      required:
        - form_id
      properties:
        form_id:
          $ref: '#/components/schemas/formId'
        report_number:
          description: Identifier of a use of force report (potentially containing multiple incidents)
          type: string
          example: UOF20-10-5
        incident_case_number:
          description: Internal agency case number assigned to the incident
          type: string
          example: "21 - 4948"
        incident_date_1:
          description: >
            Date of the incident. This is source column `IncidentDate`, the date
            the OAG dashboard uses.
          type: string
          format: date
          example: "2021-04-08"
        agency_county:
          description: County of the *agency* (not the incident location). Source column `County`.
          allOf:
            - $ref: '#/components/schemas/county'
          nullable: true
        agency_name:
          description: Name of the agency
          type: string
          example: Clayton PD
        incident_municipality:
          description: Municipality where the incident occurred
          type: string
          nullable: true
          example: Clayton borough
        incident_municipality_county:
          description: County where the incident occurred
          allOf:
            - $ref: '#/components/schemas/county'
          nullable: true
        officer_name_id:
          allOf:
            - $ref: '#/components/schemas/officerNameId'
          nullable: true
        officer_name:
          description: >
            The most common name associated with `officer_name_id` (source
            column `OfficerName`). See `/officers/{officer_name_id}/name_variants`
            for the others. `null` when `officer_name_id` is `null`: for those
            incidents the source has no officer identity.
          type: string
          nullable: true
          example: Stanley Williams
        officer_age:
          type: integer
          nullable: true
          example: 63
        officer_race:
          allOf:
            - $ref: '#/components/schemas/race'
          nullable: true
        officer_rank:
          type: string
          nullable: true
          example: Not Provided
        officer_gender:
          allOf:
            - $ref: '#/components/schemas/gender'
          nullable: true
        officer_injured:
          description: True if the officer was injured. C.f. attributes `officer_injury_type` and `officer_medical_treatment`.
          type: boolean
          nullable: true
        video_footage:
          description: Whether there is video footage. C.f. attribute `video_type`.
          type: string
          enum: ["Yes", "No", "Unknown"]
        indoors:
          description: True if the incident was indoors. Not exclusive of `outdoors`.
          type: boolean
        outdoors:
          description: True if the incident was outdoors. Not exclusive of `indoors`.
          type: boolean
        subject_count:
          description: Number of subjects. Matches the number of rows at `/incidents/{form_id}/subjects`.
          type: integer
        subject_injured_count:
          description: >
            Number of injured subjects (source column `TotalSubInjuredInIncident`).
            Wherever both are known, it equals the number of the incident's
            subjects with `injured` true. (In njoaguof releases before 1.16.0
            this field was unreliable.)
          type: integer
          nullable: true
        other_officer_involved:
          description: >
            True if another officer was involved. Only populated for 2020 and
            2021; `null` for almost every later incident.
          type: boolean
          nullable: true
        officer_in_uniform:
          type: boolean
          nullable: true
    subject:
      type: object
      required:
        - form_id
        - index
      properties:
        form_id:
          $ref: '#/components/schemas/formId'
        index:
          description: Subject index within the incident (1 = first subject)
          type: integer
          example: 1
        arrested:
          type: boolean
          nullable: true
        type:
          type: string
          enum: ["Person", "Animal", "Other", "Unknown Subject(s)"]
          nullable: true
        age:
          type: integer
          nullable: true
        juvenile:
          type: boolean
          nullable: true
        race:
          allOf:
            - $ref: '#/components/schemas/race'
          nullable: true
        gender:
          allOf:
            - $ref: '#/components/schemas/gender'
          nullable: true
        injured:
          description: True if the subject was injured in the incident
          type: boolean
          nullable: true
        injured_prior:
          description: True if the subject was injured *before* the incident
          type: boolean
          nullable: true
    incidentAttributeRow:
      description: >
        A row of an `incident`-shaped attribute. The value column is named as
        in the codebook (`value_column`).
      type: object
      required:
        - form_id
      properties:
        form_id:
          $ref: '#/components/schemas/formId'
      additionalProperties:
        type: string
    incidentSubjectAttributeRow:
      description: >
        A row of an `incident_subject`-shaped attribute. The value column is
        named as in the codebook (`value_column`).
      type: object
      required:
        - form_id
        - index
      properties:
        form_id:
          $ref: '#/components/schemas/formId'
        index:
          description: >
            Position of the value in the source list (1 = first). This is
            **not** a subject index.
          type: integer
      additionalProperties:
        type: string
    codebookRow:
      type: object
      required:
        - attribute
        - table
        - shape
        - value_column
      properties:
        attribute:
          $ref: '#/components/schemas/attributeName'
        table:
          description: Name of the table in the njoaguof R package
          type: string
          example: incident_subject_force_type
        shape:
          type: string
          enum: ["incident", "incident_subject"]
        value_column:
          description: Name of the column holding the value
          type: string
          example: force_type
    levelRow:
      type: object
      required:
        - attribute
        - position
        - level
      properties:
        attribute:
          $ref: '#/components/schemas/attributeName'
        position:
          description: Position of the level in the declared order (1 = first)
          type: integer
        level:
          type: string
          example: Clear
    agency:
      type: object
      required:
        - agency_name
        - incident_count
      properties:
        agency_name:
          type: string
          example: Aberdeen Twp PD
        agency_county:
          allOf:
            - $ref: '#/components/schemas/county'
          nullable: true
        incident_count:
          type: integer
          example: 157
    officer:
      type: object
      required:
        - officer_name_id
        - officer_name
        - incident_count
      properties:
        officer_name_id:
          $ref: '#/components/schemas/officerNameId'
        officer_name:
          description: The most common name associated with `officer_name_id`
          type: string
          example: Ronald Morello
        incident_count:
          type: integer
          example: 4
    nameVariant:
      type: object
      required:
        - officer_name_id
        - officer_name
      properties:
        officer_name_id:
          $ref: '#/components/schemas/officerNameId'
        officer_name:
          description: A name variant
          type: string
          example: Ron Morello
    countRow:
      description: >
        One column per `by` dimension, named as the dimension, plus `count`.
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          example: 3879
      additionalProperties:
        nullable: true
        oneOf:
          - type: string
          - type: integer
          - type: boolean
    attributeName:
      type: string
      enum:
        - contact_origin
        - lighting
        - location_type
        - officer_injury_type
        - officer_medical_treatment
        - planned_contact
        - subject_action
        - subject_force_type
        - subject_injury
        - subject_medical_treatment
        - subject_perceived_condition
        - subject_reason_not_arrested
        - subject_resistance
        - type
        - video_type
        - weather
      example: weather
    error:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "404"
        detail:
          type: string
          example: "Item not found"
    failure:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error'
  parameters:
    pageSize:
      name: page_size
      in: query
      description: Maximum number of results to return in a single reply
      required: false
      schema:
        type: integer
        format: int32
        default: 100
        example: 100
    pageNumber:
      name: page_number
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        example: 1
    formId:
      name: form_id
      in: path
      description: Unique identifier of an incident
      required: true
      schema:
        $ref: '#/components/schemas/formId'
    officerNameId:
      name: officer_name_id
      in: path
      description: Officer identifier
      required: true
      schema:
        $ref: '#/components/schemas/officerNameId'
    attribute:
      name: attribute
      in: path
      description: >
        Attribute name: the njoaguof table name without its `incident_` prefix.
        An unknown attribute returns 404.
      required: true
      schema:
        $ref: '#/components/schemas/attributeName'
    year:
      name: year
      in: query
      description: Only incidents in this year (of `incident_date_1`)
      required: false
      schema:
        type: integer
        minimum: 2020
        maximum: 2026
        example: 2023
    startDate:
      name: start_date
      in: query
      description: Only incidents on or after this date (`incident_date_1`)
      required: false
      schema:
        type: string
        format: date
        example: "2023-01-01"
    endDate:
      name: end_date
      in: query
      description: >
        Only incidents on or before this date (`incident_date_1`). Must not be
        before `start_date`.
      required: false
      schema:
        type: string
        format: date
        example: "2023-06-30"
    agency:
      name: agency
      in: query
      description: >
        Only incidents reported by this agency (exact `agency_name`, as listed at
        `/nj/use_of_force/agencies`)
      required: false
      schema:
        type: string
        example: Newark PD
    agencyCounty:
      name: agency_county
      in: query
      description: Only incidents reported by agencies in this county
      required: false
      schema:
        $ref: '#/components/schemas/county'
    incidentMunicipality:
      name: incident_municipality
      in: query
      description: Only incidents in this municipality (e.g. "Newark city")
      required: false
      schema:
        type: string
        example: Newark city
    incidentMunicipalityCounty:
      name: incident_municipality_county
      in: query
      description: Only incidents in this county
      required: false
      schema:
        $ref: '#/components/schemas/county'
    officerNameIdQuery:
      name: officer_name_id
      in: query
      description: Only incidents involving this officer
      required: false
      schema:
        $ref: '#/components/schemas/officerNameId'
    byIncidents:
      name: by
      in: query
      description: >
        Comma-separated list of 1 to 3 distinct dimensions to group by. Allowed:
        `year`, `month` (as `YYYY-MM`), `agency`, `agency_county`,
        `incident_municipality`, `incident_municipality_county`,
        `officer_gender`, `officer_race`, `video_footage`, and **at most one**
        attribute name (see `/nj/use_of_force/attributes`).
      required: true
      schema:
        type: string
        example: year,agency_county
    bySubjects:
      name: by
      in: query
      description: >
        Comma-separated list of 1 to 3 distinct dimensions to group by. Allowed:
        `year`, `month` (as `YYYY-MM`), `agency`, `agency_county`,
        `incident_municipality`, `incident_municipality_county`,
        `officer_gender`, `officer_race`, `video_footage`, and the subject fields
        `type`, `race`, `gender`, `arrested`, `juvenile`, `injured`. Attributes
        are not allowed.
      required: true
      schema:
        type: string
        example: agency_county,race

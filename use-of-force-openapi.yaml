                - {"officer_name_id": 17048, "officer_name": "Ronald Morello Sr"}
                links: {"self": "https://api.tor-gu.com/nj/use_of_force/officers/17048/name_variants"}
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
      tags:
      - officers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OfficersFunction.Arn}/invocations"
        responses:
          default:
